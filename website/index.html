<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marlo</title>
    <meta name="description" content="Marlo sorts your email, compares your travel options and plans your trips. Just message it on WhatsApp." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <noscript>
      <div style="max-width:34rem;margin:0 auto;padding:3rem 16px;font:1.125rem/1.4 system-ui,sans-serif">
        <p>Marlo sorts your email, compares your travel options and plans your trips.</p>
        <p style="font-size:2rem;font-weight:800;margin:1rem 0">
          <a href="https://wa.me/447552639982" aria-label="Message Marlo on WhatsApp" style="color:inherit">+44 7552 639982</a>
        </p>
        <p>Message it on WhatsApp.</p>
      </div>
    </noscript>
    <header id="bar"></header>
    <section id="hero"></section>
    <section id="phone" aria-label="Marlo in a WhatsApp conversation">
      <div class="phone__stage">
        <div class="phone__captions" id="captions"></div>
        <div class="phone" aria-hidden="false">
          <div class="phone__notch" aria-hidden="true"></div>
          <div class="wa">
            <div class="wa__head" aria-hidden="true">
              <span class="wa__back">&#8249;</span>
              <span class="wa__avatar">M</span>
              <span class="wa__who"><strong>Marlo</strong><small>online</small></span>
            </div>
            <div class="wa__chat">
              <main id="thread"></main>
            </div>
            <div class="wa__input" aria-hidden="true">
              <span class="wa__field">Message</span>
              <span class="wa__send"></span>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="does"></section>
    <footer id="close"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
